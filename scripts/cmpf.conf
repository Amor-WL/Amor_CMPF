# CMPF 通用多进程框架配置文件

# worker进程数量，默认值为2
worker.count=2

# worker最大连续失败次数，超过此次数后停止尝试重启
worker.max_fail_count=15

# worker连续失败重置时间（分钟），超过此时间间隔的退出不视为"连续"失败
# 例如：30 = 两次退出间隔超过30分钟，则失败次数重置为1而不是累加
worker.reset_fail_interval_minutes=30

# manager日志目录，默认值为当前目录下的log文件夹
manager.log.dir=manager_log

# worker日志目录，默认值为当前目录下的log文件夹
worker.log.dir=worker_log